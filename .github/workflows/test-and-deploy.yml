name: Test and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.12'
  TERRAFORM_VERSION: '1.5.0'

jobs:
  # Job 1: Ejecutar tests de Python
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: modules/lambda/functions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run unit tests
        working-directory: modules/lambda/functions
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m unittest discover -s . -p "test_*.py" -v
      
      - name: Generate coverage report
        working-directory: modules/lambda/functions
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./modules/lambda/functions/coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Job 2: Validar Terraform
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      
      - name: Terraform Init
        run: terraform init -backend=false
      
      - name: Terraform Validate
        run: terraform validate

  # Job 3: Deploy (solo en main)
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      api_url: ${{ steps.tf_output.outputs.api_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_amplify_github_token: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_intermediate_subdomain: ${{ secrets.INTERMEDIATE_SUBDOMAIN }}
          TF_VAR_subdomain: ${{ secrets.SUBDOMAIN }}
          TF_VAR_amplify_app_name: ${{ secrets.AMPLIFY_APP_NAME }}
          TF_VAR_amplify_repository_url: ${{ secrets.AMPLIFY_REPOSITORY_URL }}
          TF_VAR_amplify_branch: ${{ secrets.AMPLIFY_BRANCH }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_amplify_github_token: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_intermediate_subdomain: ${{ secrets.INTERMEDIATE_SUBDOMAIN }}
          TF_VAR_subdomain: ${{ secrets.SUBDOMAIN }}
          TF_VAR_amplify_app_name: ${{ secrets.AMPLIFY_APP_NAME }}
          TF_VAR_amplify_repository_url: ${{ secrets.AMPLIFY_REPOSITORY_URL }}
          TF_VAR_amplify_branch: ${{ secrets.AMPLIFY_BRANCH }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
      
      - name: Deploy Lambda Functions
        run: |
          cd modules/lambda/functions
          zip -r get_visits.zip get_visits.py
          zip -r increment_visits.zip increment_visits.py
          
          # Actualizar funciones Lambda
          aws lambda update-function-code \
            --function-name get-visits \
            --zip-file fileb://get_visits.zip \
            --region ${{ env.AWS_REGION }} || echo "Function not found, will be created by Terraform"
          
          aws lambda update-function-code \
            --function-name increment-visits \
            --zip-file fileb://increment_visits.zip \
            --region ${{ env.AWS_REGION }} || echo "Function not found, will be created by Terraform"
      
      - name: Output Deployment Info
        id: tf_output
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Terraform Version**: ${{ env.TERRAFORM_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          
          # Obtener API URL y exportar como output
          API_URL=$(terraform output -raw api_gateway_endpoint 2>/dev/null || echo "")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "- **API URL**: $API_URL" >> $GITHUB_STEP_SUMMARY
          
          terraform output -json >> deployment-outputs.json
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY

  # Job 4: Integration Tests (post-deploy)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        env:
          API_URL: ${{ needs.deploy.outputs.api_url }}
        run: |
          if [ -n "$API_URL" ]; then
            echo "Testing API at: $API_URL"
            
            # Test GET visits
            echo "Testing GET /visits/cv..."
            curl -f "$API_URL/visits/cv" || exit 1
            
            # Test POST increment
            echo "Testing POST /visits/cv..."
            curl -f -X POST "$API_URL/visits/cv
            echo "Testing API at: $API_URL"
            
            # Test GET visits
            curl -f "$API_URL/visits/home" || exit 1
            
            # Test POST increment
            curl -f -X POST "$API_URL/visits/home" || exit 1
            
            echo "✅ Integration tests passed!"
          else
            echo "⚠️ API URL not found, skipping integration tests"
          fi
